[project]
name = "rpa-excel-ui-automation"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "merzamac", email = "100945727+merzamac@users.noreply.github.com"},
]
dependencies = ["uiautomation>=2.0.29"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren una instancia real de Excel clasico (RUN_EXCEL_INTEGRATION=1)",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true
